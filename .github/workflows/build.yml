name: Build OPay APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # local.properties is committed with the demo keys. Repo secrets (if present)
      # override them; empty/missing secrets are skipped so they never clobber values.
      - name: Apply secret overrides to local.properties
        env:
          TERMII_BASE_URL: ${{ secrets.TERMII_BASE_URL }}
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
          TERMII_SENDER_ID: ${{ secrets.TERMII_SENDER_ID }}
          JSONBIN_MASTER_KEY: ${{ secrets.JSONBIN_MASTER_KEY }}
          JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
          PAYSTACK_DEFAULT_SECRET: ${{ secrets.PAYSTACK_DEFAULT_SECRET }}
        run: |
          touch local.properties
          if [ -n "$TERMII_BASE_URL" ]; then echo "TERMII_BASE_URL=${TERMII_BASE_URL}" >> local.properties; fi
          if [ -n "$TERMII_API_KEY" ]; then echo "TERMII_API_KEY=${TERMII_API_KEY}" >> local.properties; fi
          if [ -n "$TERMII_SENDER_ID" ]; then echo "TERMII_SENDER_ID=${TERMII_SENDER_ID}" >> local.properties; fi
          if [ -n "$JSONBIN_MASTER_KEY" ]; then echo "JSONBIN_MASTER_KEY=${JSONBIN_MASTER_KEY}" >> local.properties; fi
          if [ -n "$JSONBIN_BIN_ID" ]; then echo "JSONBIN_BIN_ID=${JSONBIN_BIN_ID}" >> local.properties; fi
          if [ -n "$PAYSTACK_DEFAULT_SECRET" ]; then echo "PAYSTACK_DEFAULT_SECRET=${PAYSTACK_DEFAULT_SECRET}" >> local.properties; fi

      - name: Build with Gradle (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_on: error
          command: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: OPay-APK
          path: app/build/outputs/apk/release/*.apk
